<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction</title>
</head>
<body>
    <h2>Loan Prediction App</h2>

    <form action="/predict" method="post">
        <input type="text" name="income" placeholder="Income" required><br><br>
        <input type="text" name="age" placeholder="Age" required><br><br>
        <input type="text" name="loan" placeholder="Loan Amount" required><br><br>

        <button type="submit">Predict</button>
    </form>

    <h3>{{ prediction_text }}</h3>
</body>
</html>
